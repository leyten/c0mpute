							<text transform="matrix(1 0 0 1 2573.8062 2442.4717)"><tspan x="0" y="0" class="st23 st13 st17">A possible future MIP for a </tspan><tspan x="0" y="33" class="st23 st13 st17">funding process for all </tspan><tspan x="0" y="66" class="st23 st13 st17">budgetary decisions </tspan><tspan x="0" y="99" class="st23 st13 st17">concerning the evolution </tspan><tspan x="0" y="132" class="st23 st13 st17">of the Mina Protocol and </tspan><tspan x="0" y="165" class="st23 st13 st17">ecosystem. Drawing on a </tspan><tspan x="0" y="198" class="st23 st13 st17">decentralized treasury </tspan><tspan x="0" y="231" class="st23 st13 st17">powered by a zkApp, no </tspan><tspan x="0" y="264" class="st23 st13 st17">single actor or group </tspan><tspan x="0" y="297" class="st23 st13 st17">would control the </tspan><tspan x="0" y="330" class="st23 st13 st17">process.</tspan></text>

							<rect x="866.3" y="1963.7" class="st2" width="326.5" height="824.2"/>
							<text transform="matrix(1 0 0 1 884.3453 1999.2208)"><tspan x="0" y="0" class="st23 st13 st17">The Mina Improvement </tspan><tspan x="0" y="33" class="st23 st13 st17">Proposal (MIP) process is </tspan><tspan x="0" y="66" class="st23 st13 st17">a mechanism open to all </tspan><tspan x="0" y="99" class="st23 st13 st17">token holders to propose </tspan><tspan x="0" y="132" class="st23 st13 st17">important changes to the </tspan><tspan x="0" y="165" class="st23 st13 st17">protocol or new features </tspan><tspan x="0" y="198" class="st23 st13 st17">for Mina. A group of MIP </tspan><tspan x="0" y="231" class="st23 st13 st17">Editors oversees the </tspan><tspan x="0" y="264" class="st23 st13 st17">process to check that </tspan><tspan x="0" y="297" class="st23 st13 st17">each step is carried out </tspan><tspan x="0" y="330" class="st23 st13 st17">correctly. MIPs are </tspan><tspan x="0" y="363" class="st23 st13 st17">accepted by a </tspan><tspan x="0" y="396" class="st23 st13 st17">stake-weighted on-chain </tspan><tspan x="0" y="429" class="st23 st13 st17">vote (OCV). Any Mina </tspan><tspan x="0" y="462" class="st23 st13 st17">account can vote by </tspan><tspan x="0" y="495" class="st23 st13 st17">either using its tokens or </tspan><tspan x="0" y="528" class="st23 st13 st17">delegating its tokens to a </tspan><tspan x="0" y="561" class="st23 st13 st17">block producer that can </tspan><tspan x="0" y="594" class="st23 st13 st17">vote in its stead (weighted </tspan><tspan x="0" y="627" class="st23 st13 st17">by the stake delegated to </tspan><tspan x="0" y="660" class="st23 st13 st17">it). This process enables </tspan><tspan x="0" y="693" class="st23 st13 st17">the community to decide </tspan><tspan x="0" y="726" class="st23 st13 st17">on the adoption of key </tspan><tspan x="0" y="759" class="st23 st13 st17">upgrades to the protocol.</tspan></text>
						</g>
					</g>
				</g>
