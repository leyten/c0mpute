ize="19" fill="rgba(255,255,255,0.7)" text-anchor="start" font-weight="normal" letter-spacing="0"><tspan x="1946" dy="0">A GPU behind a home router joins a swarm</tspan><tspan x="1946" dy="26.599999999999998">with one command. No port forwarding, no</tspan><tspan x="1946" dy="26.599999999999998">manual setup, only its assigned block of</tspan><tspan x="1946" dy="26.599999999999998">the model.</tspan></text></g></g></g><g><g><rect x="2520" y="551" width="400" height="78" fill="#000" stroke="rgba(255,255,255,0.3)" stroke-width="1.5"/><text x="2540" y="597.35" font-family="'Courier New', Monaco, Consolas, monospace" font-size="21" fill="#fff" text-anchor="start" font-weight="normal" letter-spacing="0"><tspan x="2540" dy="0">Per-GPU identity and pay</tspan></text></g><g display="none"><g><rect x="2440" y="378" width="560" height="159" fill="#0a0a0a" stroke="rgba(255,255,255,0.35)" stroke-width="1.5"/><rect x="2440" y="378" width="6" height="159" fill="#22c55e" opacity="0.25"/><text x="2466" y="420" font-family="'Courier New', Monaco, Consolas, monospace" font-size="21" fill="#fff" text-anchor="start" font-weight="bold" letter-spacing="0"><tspan x="2466" dy="0">Per-GPU identity and pay</tspan></text><text x="2466" y="456" font-family="'Courier New', Monaco, Consolas, monospace" font-size="19" fill="rgba(255,255,255,0.7)" text-anchor="start" font-weight="normal" letter-spacing="0"><tspan x="2466" dy="0">Each GPU in a swarm joins with its own</tspan><tspan x="2466" dy="26.599999999999998">identity and earns its own balance for the</tspan><tspan x="2466" dy="26.599999999999998">tokens it helped produce.</tspan></text></g></g></g></g></g><g><rect x="60" y="870" width="520" height="560" fill="none" stroke="rgba(255,255,255,0.18)" stroke-width="1.5"/><text x="100" y="960" font-family="'argent-pixel-cf', sans-serif" font-size="44" fill="#fff">Protocol</text><text x="100" y="1010" font-family="'Courier New', Monaco, Consolas, monospace" font-size="19" fill="rgba(255,255,255,0.55 ing</tspan></text><text x="746" y="1016" font-family="'Courier New', Monaco, Consolas, monospace" font-size="19" fill="rgba(255,255,255,0.7)" text-anchor="start" font-weight="normal" letter-spacing="0"><tspan x="746" dy="0">A draft-verify loop that multiplies tokens</tspan><tspan x="746" dy="26.599999999999998">per network round trip. The trick that</tspan><tspan x="746" dy="26.599999999999998">makes WAN inference usable.</tspan></text></g></g></g><g><g><rect x="720" y="1225" width="400" height="78" fill="rgba(34,197,94,0.16)" stroke="rgba(34,197,94,0.8)" stroke-width="1.5"/><text x="740" y="1271.35" font-family="'Courier New', Monaco, Consolas, monospace" font-size="21" fill="#fff" text-anchor="start" font-weight="normal" letter-spacing="0"><tspan x="740" dy="0">Signed receipts</tspan></text></g><g display="none"><g><rect x="720" y="1079" width="560" height="132" fill="#0a0a0a" stroke="rgba(255,255,255,0.35)" stroke-width="1.5"/><rect x="720" y="1079" width="6" height="132" fill="#22c55e" opacity="0.8"/><text x="746" y="1121" font-family="'Courier New', Monaco, Consolas, monospace" font-size="21" fill="#fff" text-anchor="start" font-weight="bold" letter-spacing="0"><tspan x="746" dy="0">Signed receipts</tspan></text><text x="746" y="1157" font-family="'Courier New', Monaco, Consolas, monospace" font-size="19" fill="rgba(255,255,255,0.7)" text-anchor="start" font-weight="normal" letter-spacing="0"><tspan x="746" dy="0">Every job emits a verifiable, signed</tspan><tspan x="746" dy="26.599999999999998">receipt anyone can check.</tspan></text></g></g></g><g><g><rect x="1320" y="1111" width="400" height="78" fill="rgba(128,160,193,0.08)" stroke="#80a0c1" stroke-width="3.5"/><text x="1340" y="1157.35" font-family="'Courier New', Monaco, Consolas, monospace" font-size="21" fill="#fff" text-anchor="start" font-weight="normal" letter-spacing="0"><tspan x="1340" dy="0">Betanet PoC</tspan></text></g><g display="none"><g><rect x="1320" y="911" width="560" height="186" fill="#0a0a0a" stroke="rgba(255,255,255,0.35)" stroke-width="1.5"/><rect x="1320" y="911" width="6" height="186" fill="#80a0c1" opacity="0.8"/><text x="1346" y="953" font-family="'Courier New', Monaco, Consolas, monospace" font-size="21" fill="#fff" text-anchor="start" font-weight="bold" letter-spacing="0"><tspan x="1346" dy="0">Betanet PoC</tspan></text><text x="1346" y="989" font-family="'Courier New', Monaco, Consolas, monospace" font-size="19" fill="rgba(255,255,255,0.7)" text-anchor="start" font-weight="normal" letter-spacing="0"><tspan x="1346" dy="0">A model too big for any one GPU, sharded</tspan><tspan x="1346" dy="26.599999999999998">across scattered consumer GPUs and serving</tspan><tspan x="1346" dy="26.599999999999998">real jobs end to end. The proof the whole</tspan><tspan x="1346" dy="26.599999999999998">approach is real.</tspan></text></g></g></g><g><g><rect x="1920" y="1054" width="400" height="78" fill="#000" stroke="rgba(255,255,255,0.3)" stroke-width="1.5"/><text x="1940" y="1100.35" font-family="'Courier New', Monaco, Consolas, monospace" font-size="21" fill="#fff" text-anchor="start" font-weight="normal" letter-spacing="0"><tspan x="1940" dy="0">Any-model runtime</tspan></text></g><g display="none"><g><rect x="1920" y="854" width="560" height="186" fill="#0a0a0a" stroke="rgba(255,255,255,0.35)" stroke-width="1.5"/><rect x="1920" y="854" width="6" height="186" fill="#22c55e" opacity="0.25"/><text x="1946" y="896" font-family="'Courier New', Monaco, Consolas, monospace" font-size="21" fill="#fff" text-anchor="start" font-weight="bold" letter-spacing="0"><tspan x="1946" dy="0">Any-model runtime</tspan></text><text x="1946" y="932" font-family="'Courier New', Monaco, Consolas, monospace" font-size="19" fill="rgba(255,255,255,0.7)" text-anchor="start" font-weight="normal" letter-spacing="0"><tspan x="1946" dy="0">One runtime interface so the network</tspan><tspan x="1946" dy="26.599999999999998">serves any model, not a hand-ported</tspan><tspan x="1946" dy="26.599999999999998">architecture. A new model onboards with no</tspan><tspan x="1946" dy="26.599999999999998">engine changes.</tspan></text></g></g></g><g><g><rect x="1920" y="1168" width="400" height="78" fill="#000" stroke="rgba(255,255,255,0.3)" stroke-width="1.5"/><text x="1940" y="1214.35" font-family="'Courier New', Monaco, Consolas, monospace" font-size="21" fill="#fff" text-anchor="start" font-weight="normal" letter-spacing="0"><tspan x="1940" dy="0">Ever-bigger models</tspan></text></g><g display="none"><g><rect x="1920" y="995" width="560" height="159" fill="#0a0a0a" stroke="rgba(255,255,255,0.35)" stroke-width="1.5"/><rect x="1920" y="995" width="6" height="159" fill="#22c55e" opacity="0.25"/><text x="1946" y="1037" font-family="'Courier New', Monaco, Consolas, monospace" font-size="21" fill="#fff" text-anchor="start" font-weight="bold" letter-spacing="0"><tspan x="1946" dy="0">Ever-bigger models</tspan></text><text x="1946" y="1073" font-family="'Courier New', Monaco, Consolas, monospace" font-size="19" fill="rgba(255,255,255,0.7)" text-anchor="start" font-weight="normal" letter-spacing="0"><tspan x="1946" dy="0">A catalog of models, each sharded across a</tspan><tspan x="1946" dy="26.599999999999998">swarm sized to its needs. The network</tspan><tspan x="1946" dy="26.599999999999998">stops being bound by any single machine.</tspan></text></g></g></g><g><g><rect x="2520" y="940" width="400" height="78" fill="#000" stroke="rgba(255,255,255,0.3)" stroke-width="1.5"/><text x="2540" y="986.35" font-family="'Courier New', Monaco, Consolas, monospace" font-size="21" fill="#fff" text-anchor="start" font-weight="normal" letter-spacing="0"><tspan x="2540" dy="0">Trustless verification</tspan></text></g><g display="none"><g><rect x="2440" y="740" width="560" height="186" fill="#0a0a0a" stroke="rgba(255,255,255,0.35)" stroke-width="1.5"/><rect x="2440" y="740" width="6" height="186" fill="#22c55e" opacity="0.25"/><text x="2466" y="782" font-family="'Courier New', 78" fill="#000" stroke="rgba(255,255,255,0.3)" stroke-width="1.5"/><text x="2540" y="1214.35" font-family="'Courier New', Monaco, Consolas, monospace" font-size="21" fill="#fff" text-anchor="start" font-weight="normal" letter-spacing="0"><tspan x="2540" dy="0">Distributed training</tspan></text></g><g display="none"><g><rect x="2440" y="995" width="560" height="159" fill="#0a0a0a" stroke="rgba(255,255,255,0.35)" stroke-width="1.5"/><rect x="2440" y="995" width="6" height="159" fill="#22c55e" opacity="0.25"/><text x="2466" y="1037" font-family="'Courier New', Monaco, Consolas, monospace" font-size="21" fill="#fff" text-anchor="start" font-weight="bold" letter-spacing="0"><tspan x="2466" dy="0">Distributed training</tspan></text><text x="2466" y="1073" font-family="'Courier New', Monaco, Consolas, monospace" font-size="19" fill="rgba(255,255,255,0.7)" text-anchor="start" font-weight="normal" letter-spacing="0"><tspan x="2466" dy="0">The same rails carry training: identity,</tspan><tspan x="2466" dy="26.599999999999998">transport, verified work, payment. A new</tspan><tspan x="2466" dy="26.599999999999998">execution core on proven infrastructure.</tspan></text></g></g></g><g><g><rect x="2520" y="1282" width="400" height="78" fill="rgba(128,160,193,0.08)" stroke="#80a0c1" stroke-width="3.5"/><text x="2540" y="1328.35" font-family="'Courier New', Monaco, Consolas, monospace" font-size="21" fill="#fff" text-anchor="start" font-weight="normal" letter-spacing="0"><tspan x="2540" dy="0">The compute fabric</tspan></text></g><g display="none"><g><rect x="2440" y="1082" width="560" height="186" fill="#0a0a0a" stroke="rgba(255,255,255,0.35)" stroke-width="1.5"/><rect x="2440" y="1082" width="6" height="186" fill="#80a0c1" opacity="0.8"/><text x="2466" y="1124" font-family="'Courier New', Monaco, Consolas, monospace" font-size="21" fill="#fff" text-anchor="start" font-weight="bold" letter-spacing="0"><tspan x="2466" dy="0">The compute fabric</tspan></text><text x="2466" y="1160"
