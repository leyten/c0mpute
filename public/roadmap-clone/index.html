    <script>
    // SVG paints in document order, so a hover tooltip can render underneath
    // a later card. Raise the hovered item to the top of its layer.
    document.querySelectorAll('#roadmap-rows > g > g:last-child > g').forEach(function (g) {
      g.addEventListener('mouseenter', function () {
        if (g !== g.parentNode.lastElementChild) g.parentNode.appendChild(g);
      });
    });
