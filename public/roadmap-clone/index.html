,94,0.16)" stroke="rgba(34,197,94,0.8)" stroke-width="1.5"/><text x="920" y="823.35" font-family="'Courier New', Monaco, Consolas, monospace" font-size="21" fill="#fff" text-anchor="start" font-weight="normal" letter-spacing="0"><tspan x="920" dy="0">WAN sharded inference</tspan></text></g><g display="none"><g><rect x="900" y="577" width="560" height="186" fill="#0a0a0a" stroke="rgba(255,255,255,0.35)" stroke-width="1.5"/><rect x="900" y="577" width="6" height="186" fill="#22c55e" opacity="0.8"/><text x="926" y="619" font-family="'Courier New', Monaco, Consolas, monospace" font-size="21" fill="#fff" text-anchor="start" font-weight="bold" letter-spacing="0"><tspan x="926" dy="0">WAN sharded inference</tspan></text><text x="926" y="655" font-family="'Courier New', Monaco, Consolas, monospace" font-size="19" fill="rgba(255,255,255,0.7)" text-anchor="start" font-weight="normal" letter-spacing="0"><tspan x="926" dy="0">Frontier-size models split across</tspan><tspan x="926" dy="26.599999999999998">scattered GPUs over the public internet,</tspan><tspan x="926" dy="26.599999999999998">proven from 120B on consumer cards up to</tspan><tspan x="926" dy="26.599999999999998">744B.</tspan></text></g></g></g><g><g><rect x="900" y="891" width="400" height="78" fill="rgba(34,197,94,0.16)" stroke="rgba(34,197,94,0.8)" stroke-width="1.5"/><text x="920" y="937.35" font-family="'Courier New', Monaco, Consolas, monospace" font-size="21" fill="#fff" text-anchor="start" font-weight="normal" letter-spacing="0"><tspan x="920" dy="0">Speculative decoding</tspan></text></g><g display="none"><g><rect x="900" y="718" width="560" height="159" fill="#0a0a0a" stroke="rgba(255,255,255,0.35)" stroke-width="1.5"/><rect x="900" y="718" width="6" height="159" fill="#22c55e" opacity="0.8"/><text x="926" y="760" font-family="'Courier New', Monaco, Consolas, monospace" font-size="21" fill="#fff" text-anchor="start" font-weight="bold" letter-spacing="0"><tspan x="926" dy="0">Speculative decoding</tspan></text><text x="926" y="796" font-family="'Courier New', Monaco, Consolas, monospace" font-size="19" fill="rgba(255,255,255,0.7)" text-anchor="start" font-weight="normal" letter-spacing="0"><tspan x="926" dy="0">A draft-verify loop that multiplies tokens</tspan><tspan x="926" dy="26.599999999999998">per network round trip. The trick that</tspan><tspan x="926" dy="26.599999999999998">makes WAN inference usable.</tspan></text></g></g></g><g><g><rect x="900" y="1005" width="400" height="78" fill="rgba(34,197,94,0.16)" stroke="rgba(34,197,94,0.8)" stroke-width="1.5"/><text x="920" y="1051.35" font-family="'Courier New', Monaco, Consolas, monospace" font-size="21" fill="#fff" text-anchor="start" font-weight="normal" letter-spacing="0"><tspan x="920" dy="0">Signed receipts</tspan></text></g><g display="none"><g><rect x="900" y="859" width="560" height="132" fill="#0a0a0a" stroke="rgba(255,255,255,0.35)" stroke-width="1.5"/><rect x="900" y="859" width="6" height="132" fill="#22c55e" opacity="0.8"/><text x="926" y="901" font-family="'Courier New', Monaco, Consolas, monospace" font-size="21" fill="#fff" text-anchor="start" font-weight="bold" letter-spacing="0"><tspan x="926" dy="0">Signed receipts</tspan></text><text x="926" y="937" font-family="'Courier New', Monaco, Consolas, monospace" font-size="19" fill="rgba(255,255,255,0.7)" text-anchor="start" font-weight="normal" letter-spacing="0"><tspan x="926" dy="0">Every job emits a verifiable, signed</tspan><tspan x="926" dy="26.599999999999998">receipt anyone can check.</tspan></text></g></g></g><g><g><rect x="1620" y="891" width="400" height="78" fill="rgba(128,160,193,0.08)" stroke="#80a0c1" stroke-width="3.5"/><text x="1640" y="937.35" font-family="'Courier New', Monaco, Consolas, monospace" font-size="21" fill="#fff" text-anchor="start" font-weight="normal" letter-spacing="0"><tspan x="1640" dy="0">Betanet PoC</tspan></text></g><g display="none"><g><rect x="1620" y="691" width="560" height="186" fill="#0a0a0a" stroke="rgba(255,255,255,0.35)" stroke-width="1.5"/><rect x="1620" y="691" width="6" height="186" fill="#80a0c1" opacity="0.8"/><text x="1646" y="733" font-family="'Courier New', Monaco, Consolas, monospace" font-size="21" fill="#fff" text-anchor="start" font-weight="bold" letter-spacing="0"><tspan x="1646" dy="0">Betanet PoC</tspan></text><text x="1646" y="769" font-family="'Courier New', Monaco, Consolas, monospace" font-size="19" fill="rgba(255,255,255,0.7)" text-anchor="start" font-weight="normal" letter-spacing="0"><tspan x="1646" dy="0">A model too big for any one GPU, sharded</tspan><tspan x="1646" dy="26.599999999999998">across scattered consumer GPUs and serving</tspan><tspan x="1646" dy="26.599999999999998">real jobs end to end. The proof the whole</tspan><tspan x="1646" dy="26.599999999999998">approach is real.</tspan></text></g></g></g><g><g><rect x="2100" y="834" width="400" height="78" fill="#000" stroke="rgba(255,255,255,0.3)" stroke-width="1.5"/><text x="2120" y="880.35" font-family="'Courier New', Monaco, Consolas, monospace" font-size="21" fill="#fff" text-anchor="start" font-weight="normal" letter-spacing="0"><tspan x="2120" dy="0">Any-model runtime</tspan></text></g><g display="none"><g><rect x="2100" y="634" width="560" height="186" fill="#0a0a0a" stroke="rgba(255,255,255,0.35)" stroke-width="1.5"/><rect x="2100" y="634" width="6" height="186" fill="#22c55e" opacity="0.25"/><text x="2126" y="676" font-family="'Courier New', Monaco, Consolas, monospace" font-size="21" fill="#fff" text-anchor="start" font-weight="bold" letter-spacing="0"><tspan x="2126" dy="0">Any-model runtime</tspan></text><text x="2126" y="712" font-family="'Courier New', Monaco, Consolas, monospace" font-size="19" fill="rgba(255,255,255,0.7)" text-anchor="start" font-weight="normal" letter-spacing="0"><tspan x="2126" dy="0">One runtime interface so the network</tspan><tspan x="2126" dy="26.599999999999998">serves any model, not a hand-ported</tspan><tspan x="2126" dy="26.599999999999998">architecture. A new model onboards with no</tspan><tspan x="2126" dy="26.599999999999998">engine changes.</tspan></text></g></g></g><g><g><rect x="2100" y="948" width="400" height="78" fill="#000" stroke="rgba(255,255,255,0.3)" stroke-width="1.5"/><text x="2120" y="994.35" font-family="'Courier New', Monaco, Consolas, monospace" font-size="21" fill="#fff" text-anchor="start" font-weight="normal" letter-spacing="0"><tspan x="2120" dy="0">Ever-bigger models</tspan></text></g><g display="none"><g><rect x="2100" y="775" width="560" height="159" fill="#0a0a0a" stroke="rgba(255,255,255,0.35)" stroke-width="1.5"/><rect x="2100" y="775" width="6" height="159" fill="#22c55e" opacity="0.25"/><text x="2126" y="817" font-family="'Courier New', Monaco, Consolas, monospace" font-size="21" fill="#fff" text-anchor="start" font-weight="bold" letter-spacing="0"><tspan x="2126" dy="0">Ever-bigger models</tspan></text><text x="2126" y="853" font-family="'Courier New', Monaco, Consolas, monospace" font-size="19" fill="rgba(255,255,255,0.7)" text-anchor="start" font-weight="normal" letter-spacing="0"><tspan x="2126" dy="0">A catalog of models, each sharded across a</tspan><tspan x="2126" dy="26.599999999999998">swarm sized to its needs. The network</tspan><tspan x="2126" dy="26.599999999999998">stops being bound by any single machine.</tspan></text></g></g></g><g><g><rect x="2580" y="720" width="400" height="78" fill="#000" stroke="rgba(255,255,255,0.3)" stroke-width="1.5"/><text x="2600" y="766.35" font-family="'Courier New', Monaco, Consolas, monospace" font-size="21" fill="#fff" text-anchor="start" font-weight="normal" letter-spacing="0"><tspan x="2600" dy="0">Trustless verification</tspan></text></g><g display="none"><g><rect x="2440" y="520" width="560" height="186" fill="#0a0a0a" stroke="rgba(255,255,255,0.35)" stroke-width="1.5"/><rect x="2440" y="520" width="6" height="186" fill="#22c55e" opacity="0.25"/><text x="2466" y="562" font-family="'Courier New', Monaco, Consolas, monospace" font-size="21" fill="#fff" text-anchor="start" font-weight="bold" letter-spacing="0"><tspan x="2466" dy="0">Trustless verification</tspan></text><text x="2466" y="598" font-family="'Courier New', Monaco, Consolas, monospace" font-size="19" fill="rgba(255,255,255,0.7)" text-anchor="start" font-weight="normal" letter-spacing="0"><tspan x="2466" dy="0">Catch a node that returns plausible</tspan><tspan x="2466" dy="26.599999999999998">garbage instead of doing its work, and</tspan><tspan x="2466" dy="26.599999999999998">slash its stake. The hard research</tspan><tspan x="2466" dy="26.599999999999998">problem.</tspan></text></g></g></g><g><g><rect x="2580" y="834" width="400" height="78" fill="#000" stroke="rgba(255,255,255,0.3)" stroke-width="1.5"/><text x="2600" y="880.35" font-family="'Courier New', Monaco, Consolas, monospace" font-size="21" fill="#fff" text-anchor="start" font-weight="normal" letter-spacing="0"><tspan x="2600" dy="0">Private inference</tspan></text></g><g display="none"><g><rect x="2440" y="634" width="560" height="186" fill="#0a0a0a" stroke="rgba(255,255,255,0.35)" stroke-width="1.5"/><rect x="2440" y="634" width="6" height="186" fill="#22c55e" opacity="0.25"/><text x="2466" y="676" font-family="'Courier New', Monaco, Consolas, monospace" font-size="21" fill="#fff" text-anchor="start" font-weight="bold" letter-spacing="0"><tspan x="2466" dy="0">Private inference</tspan></text><text x="2466" y="712" font-family="'Courier New', Monaco, Consolas, monospace" font-size="19" fill="rgba(255,255,255,0.7)" text-anchor="start" font-weight="normal" letter-spacing="0"><tspan x="2466" dy="0">Sensitive layers pinned to staked nodes,</tspan><tspan x="2466" dy="26.599999999999998">and trusted-nodes-only routing for</tspan><tspan x="2466" dy="26.599999999999998">sensitive jobs. Privacy that is earned,</tspan><tspan x="2466" dy="26.599999999999998">not claimed.</tspan></text></g></g></g><g><g><rect x="2580" y="948" width="400" height="78" fill="#000" stroke="rgba(255,255,255,0.3)" stroke-width="1.5"/><text x="2600" y="994.35" font-family="'Courier New', Monaco, Consolas, monospace" font-size="21" fill="#fff" text-anchor="start" font-weight="normal" letter-spacing="0"><tspan x="2600" dy="0">Distributed training</tspan></text></g><g display="none"><g><rect x="2440" y="775" width="560" height="159" fill="#0a0a0a" stroke="rgba(255,255,255,0.35)" stroke-width="1.5"/><rect x="2440" y="775" width="6" height="159" fill="#22c55e" opacity="0.25"/><text x="2466" y="817" font-family="'Courier New', Monaco, Consolas, monospace" font-size="21" fill="#fff" text-anchor="start" font-weight="bold" letter-spacing="0"><tspan x="2466" dy="0">Distributed training</tspan></text><text x="2466" y="853" font-family="'Courier New', Monaco, Consolas, monospace" font-size="19" fill="rgba(255,255,255,0.7)" text-anchor="start" font-weight="normal" letter-spacing="0"><tspan x="2466" dy="0">The same rails carry training: identity,</tspan><tspan x="2466" dy="26.599999999999998">transport, verified work, payment. A new</tspan><tspan x="2466" dy="26.599999999999998">execution core on proven infrastructure.</tspan></text></g></g></g><g><g><rect x="2580" y="1062" width="400" height="78" fill="rgba(128,160,193,0.08)" stroke="#80a0c1" stroke-width="3.5"/><text x="2600" y="1108.35" font-family="'Courier New', Monaco, Consolas, monospace" font-size="21" fill="#fff" text-anchor="start" font-weight="normal" letter-spacing="0"><tspan x="2600" dy="0">The compute fabric</tspan></text></g><g display="none"><g><rect x="2440" y="862" width="560" height="186" fill="#0a0a0a" stroke="rgba(255,255,255,0.35)" stroke-width="1.5"/><rect x="2440" y="862" width="6" height="186" fill="#80a0c1" opacity="0.8"/><text x="2466" y="904" font-family="'Courier New', Monaco, Consolas, monospace" font-size="21" fill="#fff" text-anchor="start" font-weight="bold" letter-spacing="0"><tspan x="2466" dy="0">The compute fabric</tspan></text><text x="2466" y="940" font-family="'Courier New', Monaco, C
