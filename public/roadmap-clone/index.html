ce" font-size="21" fill="#fff" text-anchor="start" font-weight="bold" letter-spacing="0"><tspan x="746" dy="0">Signed receipts</tspan></text><text x="746" y="986" font-family="'Courier New', Monaco, Consolas, monospace" font-size="19" fill="rgba(255,255,255,0.7)" text-anchor="start" font-weight="normal" letter-spacing="0"><tspan x="746" dy="0">Every job emits a verifiable, signed</tspan><tspan x="746" dy="26.599999999999998">receipt anyone can check.</tspan></text></g></g></g><g><g><rect x="1320" y="940" width="400" height="78" fill="rgba(128,160,193,0.08)" stroke="#80a0c1" stroke-width="3.5"/><text x="1340" y="986.35" font-family="'Courier New', Monaco, Consolas, monospace" font-size="21" fill="#fff" text-anchor="start" font-weight="normal" letter-spacing="0"><tspan x="1340" dy="0">Betanet PoC</tspan></text></g><g display="none"><g><rect x="1320" y="740" width="560" height="186" fill="#0a0a0a" stroke="rgba(255,255,255,0.35)" stroke-width="1.5"/><rect x="1320" y="740" width="6" height="186" fill="#80a0c1" opacity="0.8"/><text x="1346" y="782" font-family="'Courier New', Monaco, Consolas, monospace" font-size="21" fill="#fff" text-anchor="start" font-weight="bold" letter-spacing="0"><tspan x="1346" dy="0">Betanet PoC</tspan></text><text x="1346" y="818" font-family="'Courier New', Monaco, Consolas, monospace" font-size="19" fill="rgba(255,255,255,0.7)" text-anchor="start" font-weight="normal" letter-spacing="0"><tspan x="1346" dy="0">A model too big for any one GPU, sharded</tspan><tspan x="1346" dy="26.599999999999998">across scattered consumer GPUs and serving</tspan><tspan x="1346" dy="26.599999999999998">real jobs end to end. The proof the whole</tspan><tspan x="1346" dy="26.599999999999998">approach is real.</tspan></text></g></g></g><g><g><rect x="1920" y="940" width="400" height="78" fill="#000" stroke="rgba(255,255,255,0.3)" stroke-width="1.5"/><text x="1940" y="986.35" font-family="'Courier New', Monaco, Consolas, monospace" font-size="21" fill="#fff" text-anchor="start" font-weight="normal" letter-spacing="0"><tspan x="1940" dy="0">Any-model runtime</tspan></text></g><g display="none"><g><rect x="1920" y="740" width="560" height="186" fill="#0a0a0a" stroke="rgba(255,255,255,0.35)" stroke-width="1.5"/><rect x="1920" y="740" width="6" height="186" fill="#22c55e" opacity="0.25"/><text x="1946" y="782" font-family="'Courier New', Monaco, Consolas, monospace" font-size="21" fill="#fff" text-anchor="start" font-weight="bold" letter-spacing="0"><tspan x="1946" dy="0">Any-model runtime</tspan></text><text x="1946" y="818" font-family="'Courier New', Monaco, Consolas, monospace" font-size="19" fill="rgba(255,255,255,0.7)" text-anchor="start" font-weight="normal" letter-spacing="0"><tspan x="1946" dy="0">One runtime interface so the network</tspan><tspan x="1946" dy="26.599999999999998">serves any model, not a hand-ported</tspan><tspan x="1946" dy="26.599999999999998">architecture. A new model onboards with no</tspan><tspan x="1946" dy="26.599999999999998">engine changes.</tspan></text></g></g></g><g><g><rect x="2520" y="826" width="400" height="78" fill="#000" stroke="rgba(255,255,255,0.3)" stroke-width="1.5"/><text x="2540" y="872.35" font-family="'Courier New', Monaco, Consolas, monospace" font-size="21" fill="#fff" text-anchor="start" font-weight="normal" letter-spacing="0"><tspan x="2540" dy="0">Trustless verification</tspan></text></g><g display="none"><g><rect x="2440" y="626" width="560" height="186" fill="#0a0a0a" stroke="rgba(255,255,255,0.35)" stroke-width="1.5"/><rect x="2440" y="626" width="6" height="186" fill="#22c55e" opacity="0.25"/><text x="2466" y="668" font-family="'Courier New', Monaco, Consolas, monospace" font-size="21" fill="#fff" text-anchor="start" font-weight="bold" letter-spacing="0"><tspan x="2466" dy="0">Trustless verification</tspan></text><text x="2466" y="704" font-family="'Courier New', Monaco, Consolas, monospace" font-size="19" fill="rgba(255,255,255,0.7)" text-anchor="start" font-weight="normal" letter-spacing="0"><tspan x="2466" dy="0">Catch a node that returns plausible</tspan><tspan x="2466" dy="26.599999999999998">garbage instead of doing its work, and</tspan><tspan x="2466" dy="26.599999999999998">slash its stake. The hard research</tspan><tspan x="2466" dy="26.599999999999998">problem.</tspan></text></g></g></g><g><g><rect x="2520" y="940" width="400" height="78" fill="#000" stroke="rgba(255,255,255,0.3)" stroke-width="1.5"/><text x="2540" y="986.35" font-family="'Courier New', Monaco, Consolas, monospace" font-size="21" fill="#fff" text-anchor="start" font-weight="normal" letter-spacing="0"><tspan x="2540" dy="0">Private inference</tspan></text></g><g display="none"><g><rect x="2440" y="740" width="560" height="186" fill="#0a0a0a" stroke="rgba(255,255,255,0.35)" stroke-width="1.5"/><rect x="2440" y="740" width="6" height="186" fill="#22c55e" opacity="0.25"/><text x="2466" y="782" font-family="'Courier New', Monaco, Consolas, monospace" font-size="21" fill="#fff" text-anchor="start" font-weight="bold" letter-spacing="0"><tspan x="2466" dy="0">Private inference</tspan></text><text x="2466" y="818" font-family="'Courier New', Monaco, Consolas, monospace" font-size="19" fill="rgba(255,255,255,0.7)" text-anchor="start" font-weight="normal" letter-spacing="0"><tspan x="2466" dy="0">Sensitive layers pinned to staked nodes,</tspan><tspan x="2466" dy="26.599999999999998">and trusted-nodes-only routing for</tspan><tspan x="2466" dy="26.599999999999998">sensitive jobs. Privacy that is earned,</tspan><tspan x="2466" dy="26.599999999999998">not claimed.</tspan></text></g></g></g><g><g><rect x="2520" y="1054" width="400" height="78" fill="#000" stroke="rgba(255,255,255,0.3)" stroke-width="1.5"/><text x="2540" y="1100.35" font-family="'Courier New', Monaco, Consolas, monospace" font-size="21" fill="#fff" text-anchor="start" font-weight="normal" letter-spacing="0"><tspan x="2540" dy="0">General compute</tspan></text></g><g display="none"><g><rect x="2440" y="88
