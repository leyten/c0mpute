<svg xmlns="http://www.w3.org/2000/svg" viewBox="14 11 76 76" role="img" aria-label="Compute Network">
  <title>Compute Network</title>
  <!--
    Theme-aware favicon. A favicon cannot inherit the page's colour, so the
    adaptation lives inside the file: the mark is dark by default and flips to
    light when the browser reports a dark colour scheme.

    The mapping is deliberately the inverse of the page theme, because the tab
    strip is the opposite of the page: light mode gives a light chrome, so the
    mark must be dark to be visible there, and vice versa. Background stays
    transparent in both.

    Geometry is identical to compute-mark.svg — viewBox cropped tight so the
    artwork fills the box. At 16px, padding is what kills legibility, not
    stroke weight.
  -->
  <style>
    .mark { fill: #0B0B0C; }
    @media (prefers-color-scheme: dark) {
      .mark { fill: #FAFAF8; }
    }
  </style>
  <g class="mark">
    <path d="M29.93 74.20 L56.62 23.47 L51.38 20.53 L22.07 69.80 Z"/>
    <path d="M51.45 23.58 L76.81 65.97 L83.19 62.03 L56.55 20.42 Z"/>
    <path d="M79.45 60.29 L25.34 67.55 L26.66 76.45 L80.55 67.71 Z"/>
    <circle cx="26" cy="72" r="12"/>
    <circle cx="54" cy="22" r="8"/>
    <circle cx="80" cy="64" r="10"/>
  </g>
</svg>
