<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>c0mpute / network</title>
  <meta name="description" content="the c0mpute network, live: a globe of scattered consumer GPUs serving frontier models together over the shard protocol.">
  <meta property="og:title" content="c0mpute / network">
  <meta property="og:description" content="a live globe of scattered consumer gpus serving one model together.">
  <link rel="icon" href="https://c0mpute.ai/favicon.ico">
  <link rel="stylesheet" href="https://use.typekit.net/kwe2dpm.css">
  <link rel="stylesheet" href="style.css">
  <style>
    html, body { height: 100%; overflow: hidden; }
    .stage { position: fixed; inset: 0; background: #000; }
    #globe { position: absolute; inset: 0; width: 100%; height: 100%; cursor: grab; touch-action: none; }
    #globe.drag { cursor: grabbing; }
    .hud { position: absolute; z-index: 2; }

    .brand-hud { top: 24px; left: 30px; display: flex; align-items: baseline; gap: 10px; text-decoration: none; }
    .brand-hud .brand-name { font-size: 26px; }
    .legend-hud { top: 28px; right: 30px; display: flex; align-items: center; font-size: 11px; letter-spacing: 0.06em; text-transform: uppercase; color: rgba(255,255,255,0.5); -webkit-text-stroke: 0; }
    .legend-hud .sw { display: inline-block; width: 8px; height: 8px; margin: 0 6px 0 18px; }
    .legend-hud .sw:first-child { margin-left: 0; }

    .stats { top: 50%; transform: translateY(-50%); display: flex; flex-direction: column; gap: 26px; }
    .stats-left { left: 34px; text-align: left; }
    .stats-right { right: 34px; text-align: right; }
    /* line-height 1.15 + padding so argent descenders (3, 9) never clip into the label below */
    .stat .v { font-size: 40px; line-height: 1.15; color: #fff; padding-bottom: 2px; }
    .stat .v small { font-size: 15px; color: rgba(255,255,255,0.55); -webkit-text-stroke: 0; }
    .stat .k { margin-top: 7px; font-size: 11px; color: rgba(255,255,255,0.5); letter-spacing: 0.07em; text-transform: uppercase; -webkit-text-stroke: 0; }
    .stats-left .stat { border-left: 1px solid rgba(34,197,94,0.55); padding-left: 13px; }
    .stats-right .stat { border-right: 1px solid rgba(34,197,94,0.55); padding-right: 13px; }

    .ticker { left: 34px; bottom: 30px; font-size: 12.5px; max-width: 340px; }
    .ticker .lbl { font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase; color: rgba(255,255,255,0.4); margin-bottom: 8px; -webkit-text-stroke: 0; }
    .ticker .row { padding: 3px 0; color: rgba(255,255,255,0.55); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; transition: opacity .4s; }
    .ticker .row b { color: #fff; -webkit-text-stroke: 0; }
    .ticker .row .g { color: #22c55e; }
    .ticker .row .loc { color: rgba(255,255,255,0.8); }

    .cmd-hud { right: 30px; bottom: 28px; display: flex; align-items: stretch; gap: 8px; max-width: min(600px, 92vw); }
    .cmd-hud code { font-family: 'Courier New',monospace; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.14); padding: 10px 13px; color: #fff; font-size: 12.5px; -webkit-text-stroke: 0; white-space: nowrap; overflow-x: auto; flex: 1; min-width: 0; display: flex; align-items: center; }
    .cmd-hud button { font-family: 'Courier New',monospace; background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.14); color: #fff; font-size: 11px; letter-spacing: 0.06em; text-transform: uppercase; padding: 0 13px; cursor: pointer; -webkit-text-stroke: 0; white-space: nowrap; }
    .cmd-hud button:hover { background: rgba(34,197,94,0.18); border-color: rgba(34,197,94,0.5); }
    .cmd-hud button:focus-visible { outline: 1px solid #22c55e; outline-offset: 1px; }

    /* node explorer detail panel */
    .node-panel { right: 30px; top: 72px; width: 308px; max-width: calc(100vw - 60px); border: 1px solid rgba(255,255,255,0.16); background: #000; padding: 15px 18px 18px; display: none; }
    .node-panel .np-top { display: flex; align-items: baseline; gap: 8px; }
    .node-panel .np-city { font-size: 21px; color: #fff; }
    .node-panel .np-cc { font-size: 12px; color: rgba(255,255,255,0.5); }
    .node-panel .np-x { margin-left: auto; background: none; border: 1px solid rgba(255,255,255,0.16); color: #fff; width: 24px; height: 24px; font-size: 15px; line-height: 1; cursor: pointer; -webkit-text-stroke: 0; }
    .node-panel .np-x:hover { background: rgba(255,255,255,0.1); }
    .node-panel .np-status { margin-top: 9px; font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; -webkit-text-stroke: 0; }
    .node-panel .np-status.serve { color: #22c55e; } .node-panel .np-status.stand { color: rgba(255,255,255,0.82); } .node-panel .np-status.off { color: rgba(255,255,255,0.55); }
    .node-panel .np-id { margin-top: 3px; font-size: 10.5px; color: rgba(255,255,255,0.38); word-break: break-all; -webkit-text-stroke: 0; }
    .node-panel .np-rows { margin-top: 15px; display: flex; flex-direction: column; gap: 9px; }
    .node-panel .np-row { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; font-size: 12.5px; }
    .node-panel .np-row .kk { color: rgba(255,255,255,0.5); letter-spacing: 0.02em; }
    .node-panel .np-row .vv { color: #fff; text-align: right; }
    .node-panel .np-row .vv .of { color: rgba(255,255,255,0.4); }
    .node-panel .np-bar { margin-top: -2px; height: 8px; background: rgba(255,255,255,0.07); position: relative; }
    .node-panel .np-bar .fl { position: absolute; top: 0; bottom: 0; background: #22c55e; }
    @media (max-width: 820px) { .node-panel { right: 20px; left: 20px; top: auto; bottom: 90px; width: auto; } }

    @media (max-width: 820px) {
      .stats { top: auto; transform: none; flex-direction: row; gap: 18px; }
      .stats-left { left: 20px; bottom: 92px; }
      .stats-right { right: 20px; bottom: 92px; }
      .stat .v { font-size: 26px; }
      .ticker, .legend-hud { display: none; }
      .cmd-hud { left: 20px; right: 20px; bottom: 20px; max-width: none; }
    }
  </style>
</head>
<body>
  <div class="stage">
    <canvas id="globe"></canvas>

    <a href="https://c0mpute.ai" class="hud brand-hud">
      <span class="brand-name pixel-serif">c<span class="logo-o">0</span>mpute</span>
      <span class="brand-sub">/ network</span>
    </a>
    <div class="hud legend-hud">
      <i class="sw" style="background:#22c55e"></i>serving
      <i class="sw" style="background:rgba(255,255,255,0.82)"></i>standby
      <i class="sw" style="background:rgba(255,255,255,0.32)"></i>joining
    </div>

    <div class="hud stats stats-left">
      <div class="stat"><div class="v pxnum" id="s-gpus">0</div><div class="k">gpus online</div></div>
      <div class="stat"><div class="v pxnum" id="s-countries">0</div><div class="k">countries</div></div>
      <div class="stat"><div class="v pxnum" id="s-rings">0</div><div class="k">rings serving</div></div>
    </div>

    <div class="hud stats stats-right">
      <div class="stat"><div class="v pxnum" id="s-toks">0<small> tok/s</small></div><div class="k">network throughput</div></div>
      <div class="stat"><div class="v pxnum" id="s-served">0</div><div class="k">tokens served today</div></div>
      <div class="stat"><div class="v pxnum" id="s-vram">0<small> TB</small></div><div class="k">gpu memory pooled</div></div>
    </div>

    <div class="hud ticker">
      <div class="lbl">joining now</div>
      <div id="ticker-rows"></div>
    </div>

    <div class="hud cmd-hud">
      <code id="cmd">npx @c0mpute/worker --mode shard --token &lt;your-token&gt;</code>
      <button id="copy" type="button">copy</button>
    </div>

    <div class="hud node-panel" id="npanel"></div>
  </div>

        else if(Math.abs(vel)>0.0003){ yaw+=vel; vel*=0.93; }           // momentum from a flick, then settle
        else if(target.active){ yaw=angLerp(yaw,target.yaw,0.05); tilt+=(target.tilt-tilt)*0.05;  // ONE-TIME ease to the visitor on load
          if(Math.abs(angLerp(yaw,target.yaw,1))<0.01 && Math.abs(target.tilt-tilt)<0.01) target.active=false; }
        pulse+=dt/2600; joins(dt);
      }
      draw(); stats(dt); requestAnimationFrame(frame); }
    function boot(){ layout();
      // lock onto the visitor's continent on load, ONE time, then it only moves on drag
      var v=visitorLonLat();
      if(reduce){ yaw=-v[0]*D2R; tilt=Math.max(-1.0,Math.min(1.0,v[1]*D2R*0.9)); draw(); stats(16); }
      else{ yaw=-v[0]*D2R-0.55; tilt=0.18;                                   // start just off, then ease in for a reveal
        target.yaw=-v[0]*D2R; target.tilt=Math.max(-1.0,Math.min(1.0,v[1]*D2R*0.9)); target.active=true; }
      requestAnimationFrame(frame); }
    var rz; window.addEventListener('resize',function(){ clearTimeout(rz); rz=setTimeout(layout,120); });
    if(cv.clientWidth) boot(); else requestAnimationFrame(boot);

    // copy the join command
    var copyBtn=document.getElementById('copy');
    if(copyBtn) copyBtn.addEventListener('click',function(){
      var txt=document.getElementById('cmd').textContent;
      var done=function(){ copyBtn.textContent='copied'; setTimeout(function(){ copyBtn.textContent='copy'; },1400); };
      if(navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(txt).then(done,done);
      else { try{ var t=document.createElement('textarea'); t.value=txt; document.body.appendChild(t); t.select(); document.execCommand('copy'); document.body.removeChild(t); done(); }catch(e){} }
    });
  })();
  </script>
</body>
</html>
